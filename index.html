:root{--bg:#f3f4f6;--card:#fff;--text:#17181b;--muted:#737780;--line:#dfe2e7;--gold:#d49a27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
.container{max-width:1500px;margin:auto;padding:22px 14px 45px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px}
h1{font-size:28px;margin:0}.subtitle{margin-top:5px;color:var(--muted);font-size:14px}
.toolbar{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px 15px;display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:12px}
.status-sub{color:var(--muted);font-size:12px;margin-top:3px}
.legend{display:flex;gap:13px;color:#777;font-size:11px;white-space:nowrap}
.legend span{display:flex;align-items:center;gap:4px}.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.available{background:#111827}.dot.locked{background:#d7d9dd}.dot.done{background:var(--gold)}
.bracket-wrap{overflow-x:auto;padding:5px 0 18px}
.bracket{min-width:1410px;height:620px;display:grid;grid-template-columns:repeat(9,150px);column-gap:7px;position:relative;margin:auto}
.round{position:relative;height:620px}.round-title{position:absolute;top:0;left:0;right:0;text-align:center;font-size:11px;font-weight:800;letter-spacing:.7px;color:#555;white-space:nowrap}
.round-title small{font-weight:400;color:#a0a3a8;letter-spacing:0;margin-left:3px}
.match{position:absolute;left:0;width:150px;height:76px}
.match-card{position:absolute;left:0;top:0;width:150px;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.035)}
.match-card.clickable{cursor:pointer}.match-card.clickable:hover{border-color:#9aa0a8;box-shadow:0 4px 12px rgba(0,0,0,.08);transform:translateY(-1px)}
.match-card.done{border-color:#caa35a}.match-card.locked{opacity:.68;background:#fafafa}
.match-card.champion-card{border:2px solid var(--gold);box-shadow:0 6px 18px rgba(180,130,20,.15)}
.slot{height:37px;padding:4px 6px;display:flex;align-items:center;gap:4px;border-bottom:1px solid #eee}.slot:last-child{border-bottom:0}
.slot.winner{background:#fffaf0}.seed{width:10px;color:#999;font-size:10px}.song{min-width:0;flex:1}
.title{font-weight:800;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.artist{font-size:9px;color:#777;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick-dot{width:13px;text-align:center;font-weight:800;font-size:11px}.empty{color:#aaa;font-size:9px}
.left.r1{grid-column:1}.left.r2{grid-column:2}.left.r3{grid-column:3}.left.r4{grid-column:4}
.center{grid-column:5}.right.r4{grid-column:6}.right.r3{grid-column:7}.right.r2{grid-column:8}.right.r1{grid-column:9}

.final{display:none;text-align:center;background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 18px;margin:10px auto 20px;max-width:620px}
.final.show{display:block}.trophy{font-size:50px}.final-label{font-size:10px;letter-spacing:3px;color:#9a7a32;font-weight:800}
.final h2{font-size:32px;margin:8px 0 3px}.final .artist{font-size:17px;color:#70747c}
.hint{color:#888;line-height:1.8;margin:15px 0 0}.history{margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 15px}
.history summary{cursor:pointer;font-weight:700;font-size:13px}.history-list{color:#737780;font-size:12px;line-height:1.8;margin-top:8px}.note{margin-top:10px;color:#999;font-size:11px}
.credit{
  text-align:center;
  color:#aaa;
  font-size:11px;
  margin-top:18px;
  letter-spacing:.3px;
}
@media(max-width:900px){.toolbar{align-items:flex-start;flex-direction:column}.legend{white-space:normal;flex-wrap:wrap}}
</style>

let slots=[],history=[];
function dateSeed(){
  const d=new Date();
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,"0"),day=String(d.getDate()).padStart(2,"0");
  const key=`${y}-${m}-${day}`;
  let h=2166136261;
  for(let i=0;i<key.length;i++){h^=key.charCodeAt(i);h=Math.imul(h,16777619)}
  return h>>>0;
}
function seededRandom(seed){
  let x=seed>>>0;
  return function(){
    x+=0x6D2B79F5;
    let t=x;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function shuffleByDate(arr){
  const a=[...arr],rand=seededRandom(dateSeed());
  for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function initTournament(){
  const picked=shuffleByDate(SONG_DATABASE).slice(0,32);
  slots=Array(63).fill(null);
  picked.forEach((s,i)=>slots[i]=s);
  history=[];
  document.getElementById("final").classList.remove("show");
  document.getElementById("historyList").textContent="尚未开始。";
  renderBracket();
}
function songText(s){return `<div class="title">${escapeHtml(s.title)}</div><div class="artist">${escapeHtml(s.artist)}</div>`}
function getMatchSongs(mi){
  if(mi<16)return [slots[mi*2],slots[mi*2+1]];
  if(mi<24){let x=(mi-16)*2;return [slots[32+x],slots[32+x+1]]}
  if(mi<28){let x=(mi-24)*2;return [slots[48+x],slots[48+x+1]]}
  if(mi<30){let x=(mi-28)*2;return [slots[56+x],slots[56+x+1]]}
  return [slots[60],slots[61]];
}
function matchCard(mi,a,b){
  const wi=32+mi,w=slots[wi],locked=!a||!b,done=!!w;
  return `<div class="match-card ${done?"done":""} ${locked?"locked":"clickable"}">
    <div class="slot ${w===a&&w?"winner":""} ${!a?"empty":""}" ${!locked&&!done?`onclick="chooseWinner(${mi},0)"`:""}>
      <span class="seed"></span><div class="song">${a?songText(a):"等待上一场胜者"}</div><span class="pick-dot">${w===a?"✓":(!locked&&!done?"→":"")}</span>
    </div>
    <div class="slot ${w===b&&w?"winner":""} ${!b?"empty":""}" ${!locked&&!done?`onclick="chooseWinner(${mi},1)"`:""}>
      <span class="seed"></span><div class="song">${b?songText(b):"等待上一场胜者"}</div><span class="pick-dot">${w===b?"✓":(!locked&&!done?"→":"")}</span>
    </div>
  </div>`;
}
function renderRound(cls,title,sub,count,base){
  const gap=76;
  const tops={8:Array.from({length:8},(_,i)=>i*gap),
              4:Array.from({length:4},(_,i)=>38+i*152),
              2:Array.from({length:2},(_,i)=>114+i*304),
              1:[266]};
  let out=`<div class="round ${cls}"><div class="round-title">${title} <small>${sub}</small></div>`;
  for(let i=0;i<count;i++){
    let mi=base+i,[a,b]=getMatchSongs(mi);
    out+=`<div class="match" style="top:${tops[count][i]}px">${matchCard(mi,a,b)}</div>`;
  }
  return out+"</div>";
}
function renderBracket(){
  let out="";
  out+=renderRound("left r1","ROUND OF 16","左半区",8,0);
  out+=renderRound("left r2","QUARTER-FINALS","8强",4,16);
  out+=renderRound("left r3","SEMI-FINALS","半决赛",2,24);
  out+=renderRound("left r4","FINALIST","决赛席位",1,28);
  out+=`<div class="round r5 center"><div class="round-title">FINAL <small>总决赛</small></div><div class="match" style="top:266px">${matchCard(30,getMatchSongs(30)[0],getMatchSongs(30)[1])}</div></div>`;
  out+=renderRound("right r4","FINALIST","决赛席位",1,29);
  out+=renderRound("right r3","SEMI-FINALS","半决赛",2,26);
  out+=renderRound("right r2","QUARTER-FINALS","8强",4,20);
  out+=renderRound("right r1","ROUND OF 16","右半区",8,8);
  document.getElementById("bracket").innerHTML=out;
  const done=Array.from({length:31},(_,i)=>slots[32+i]).filter(Boolean).length;
  document.getElementById("statusTitle").textContent=slots[62]?"🏆 今日冠军已经产生":`${done}/31 场已决出`;
  document.getElementById("statusSub").textContent=slots[62]?"今天的结果已锁定，明天自动更新。":"";
  if(slots[62])showChampion(slots[62]);
}
function chooseWinner(mi,which){
  const [a,b]=getMatchSongs(mi);
  if(!a||!b||slots[32+mi])return;
  const w=which===0?a:b,l=which===0?b:a;
  slots[32+mi]=w;
  if(mi===30)slots[62]=w;
  const stage=mi<16?"16强":mi<24?"8强":mi<28?"半决赛":mi<30?"决赛席位":"总决赛";
  const side=mi<8?"左半区":mi<16?"右半区":"";
  history.push(`${side?side+" · ":""}${stage}：${w.title}（${w.artist}）胜过 ${l.title}（${l.artist}）`);
  document.getElementById("historyList").innerHTML=history.map(x=>`<div>• ${escapeHtml(x)}</div>`).join("");
  renderBracket();
}
function showChampion(s){
  document.getElementById("championTitle").textContent=s.title;
  document.getElementById("championArtist").textContent=s.artist;
  document.getElementById("final").classList.add("show");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
initTournament();
